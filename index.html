<script>
  function showError(origen, detalle) {
    var el = document.getElementById('kome-error');
    if (el) el.textContent += "\n[" + origen + "] " + detalle;
    console.error(origen, detalle);
  }
  window.showError = showError;
  window.addEventListener('error', function (e) {
    var stack = (e.error && e.error.stack) ? ('\nSTACK: ' + e.error.stack) : '';
    showError('window.onerror', (e.message || 'error desconocido') + ' — ' + (e.filename || '') + ':' + (e.lineno || '') + stack);
  });
</script>

/* ---------------------- Almacenamiento ---------------------- */
async function storageGet(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v !== null ? JSON.parse(v) : fallback;
  } catch {
    return fallback;
  }
}
async function storageSet(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    console.error("Error guardando", key, e);
  }
}

/* ---------------------- Lógica de menú ---------------------- */
function normalize(s) { return s.trim().toLowerCase(); }

function buildRebostAvailableSet(rebost) {
  const set = new Set();
  Object.values(rebost).forEach((items) => items.forEach((it) => { if (it.checked) set.add(normalize(it.name)); }));
  return set;
}

// Alimentos que SÍ figuran en el rebost pero están desmarcados: se sabe que
// no hay, así que ninguna receta que los necesite debe poder salir elegida.
// (Un ingrediente que no aparece en el rebost en absoluto no cuenta aquí —
// simplemente se añadirá a la lista de la compra si hace falta.)
function buildRebostUnavailableSet(rebost) {
  const set = new Set();
  Object.values(rebost).forEach((items) => items.forEach((it) => { if (!it.checked) set.add(normalize(it.name)); }));
  return set;
}

function recipeQualifies(recipe, filters) {
  if (recipe.ageMin && filters.edad && Number(filters.edad) < recipe.ageMin) return false;
  const strict = ["blanda", "sinAzucar", "sinGluten", "sinLactosa"];
  for (const tag of filters.dieta) {
    if (strict.includes(tag) && !recipe.dietTags.includes(tag)) return false;
  }
  if (filters.tiempos.length > 0 && !filters.tiempos.includes(recipe.prepTime)) return false;
  return true;
}

function mainProteinIngredient(recipe) {
  const p = recipe.ing.find(([, cat]) => cat === "Proteína animal" || cat === "Legumbres y proteína vegetal");
  return p ? normalize(p[0]) : null;
}

function dominantVeg(recipe) {
  const v = recipe.ing.find(([, cat]) => cat === "Verduras");
  return v ? normalize(v[0]) : null;
}

function weightFor(recipe, filters, favorites) {
  let w = 1;
  if (favorites.includes(recipe.id)) w += 3;
  if (filters.dieta.includes("vegetal") && recipe.dietTags.includes("vegetal")) w += 2;
  if (filters.dieta.includes("proteina") && recipe.dietTags.includes("proteina")) w += 2;
  return w;
}

function weightedPick(pool, filters, favorites) {
  const scored = pool.map((r) => ({ r, w: weightFor(r, filters, favorites) }));
  const total = scored.reduce((a, s) => a + s.w, 0);
  let roll = Math.random() * total;
  for (const s of scored) { roll -= s.w; if (roll <= 0) return s.r; }
  return scored[scored.length - 1].r;
}

// De entre el conjunto dado, se queda solo con las recetas que mejor
// aprovechan lo que ya hay en el rebost (más ingredientes disponibles).
// Si ninguna coincide con nada del rebost, no restringe (deja el conjunto igual).
function bestRebostTier(pool, rebostAvailable) {
  if (!rebostAvailable || rebostAvailable.size === 0) return pool;
  const scored = pool.map((r) => {
    const total = r.ing.length || 1;
    const have = r.ing.filter(([name]) => rebostAvailable.has(normalize(name))).length;
    return { r, coverage: have / total };
  });
  const maxCov = Math.max(...scored.map((s) => s.coverage));
  if (maxCov <= 0) return pool;
  return scored.filter((s) => s.coverage === maxCov).map((s) => s.r);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Recetas usadas en semanas guardadas anteriormente (candidatas a "repetir")
function buildUsedBeforeSet(history) {
  const set = new Set();
  (history || []).forEach((h) => {
    DAYS.forEach((_, di) => {
      MEALS.forEach((m) => {
        const rid = h.menu?.[di]?.[m.id];
        if (rid) set.add(rid);
      });
    });
  });
  return set;
}

function generateWeekMenu(filters, favorites, history, rebost) {
  const usedBeforeIds = buildUsedBeforeSet(history);
  const rebostAvailable = buildRebostAvailableSet(rebost || {});
  const rebostUnavailable = buildRebostUnavailableSet(rebost || {});
  const week = DAYS.map(() => ({}));
  const usedDesayunoCount = new Map(); // recipeId -> veces usado (máx 2 por semana)
  const usedComida = new Set(); // sin repetir en la semana
  const usedCena = new Set(); // sin repetir en la semana

  // Proteína/legumbre y verdura principal ya usadas esta semana en COMIDA+CENA
  // (p.ej. si hay salmón un día, no vuelve a aparecer en comida ni cena el resto de la semana)
  const usedWeeklyProtein = new Set();
  const usedWeeklyVeg = new Set();

  // Qué días (por tipo de comida) deben ser "nuevos" según el filtro
  const wantNewByMeal = {};
  MEALS.forEach((meal) => {
    const raw = Number(filters.recetasNuevas?.[meal.id]);
    const target = Number.isFinite(raw) ? Math.max(0, Math.min(DAYS.length, raw)) : DAYS.length;
    wantNewByMeal[meal.id] = new Set(shuffle(DAYS.map((_, di) => di)).slice(0, target));
  });

  DAYS.forEach((day, di) => {
    MEALS.forEach((meal) => {
      let pool = RECIPES.filter((r) => r.meal === meal.id && recipeQualifies(r, filters));
      if (pool.length === 0) pool = RECIPES.filter((r) => r.meal === meal.id);

      // 0) OBLIGATORIO: descartar recetas que usan algún ingrediente marcado
      //    como "no disponible" en el rebost (desmarcado). Solo se relaja si
      //    no quedara NINGUNA receta posible para esa comida.
      const poolAvail = pool.filter((r) => !r.ing.some(([name]) => rebostUnavailable.has(normalize(name))));
      if (poolAvail.length > 0) pool = poolAvail;

      // 1) Repetición dentro de la semana (la propia receta)
      let step = pool.filter((r) => {
        if (meal.id === "desayuno") return (usedDesayunoCount.get(r.id) || 0) < 2;
        if (meal.id === "comida") return !usedComida.has(r.id);
        return !usedCena.has(r.id);
      });
      if (step.length === 0) step = pool;

      // 2) Solo para comida/cena: no repetir proteína/legumbre ni verdura
      //    principal en TODA la semana (entre comidas y cenas)
      let step2 = step;
      if (meal.id === "comida" || meal.id === "cena") {
        step2 = step.filter((r) => {
          const p = mainProteinIngredient(r);
          return !p || !usedWeeklyProtein.has(p);
        });
        if (step2.length === 0) step2 = step;

        const step2b = step2.filter((r) => {
          const v = dominantVeg(r);
          return !v || !usedWeeklyVeg.has(v);
        });
        if (step2b.length > 0) step2 = step2b;
      }

      // 3) Preferencia nueva/repetida
      const wantNew = wantNewByMeal[meal.id].has(di);
      let preferred = step2.filter((r) => (wantNew ? !usedBeforeIds.has(r.id) : usedBeforeIds.has(r.id)));
      if (preferred.length === 0) preferred = step2;

      // 4) Priorizar lo que ya hay en el rebost
      const rebostTier = bestRebostTier(preferred, rebostAvailable);

      // 5) Elección ponderada (favoritas, dieta) dentro del mejor grupo
      const pick = weightedPick(rebostTier, filters, favorites);

      if (meal.id === "desayuno") usedDesayunoCount.set(pick.id, (usedDesayunoCount.get(pick.id) || 0) + 1);
      else if (meal.id === "comida") usedComida.add(pick.id);
      else usedCena.add(pick.id);

      if (meal.id === "comida" || meal.id === "cena") {
        const p = mainProteinIngredient(pick);
        if (p) usedWeeklyProtein.add(p);
        const v = dominantVeg(pick);
        if (v) usedWeeklyVeg.add(v);
      }

      week[di][meal.id] = pick.id;
    });
  });

  return week;
}

function computeShoppingList(weekMenu, rebost) {
  const available = buildRebostAvailableSet(rebost);
  const needed = new Map();
  if (weekMenu) {
    DAYS.forEach((day, di) => {
      MEALS.forEach((meal) => {
        const rid = weekMenu[di]?.[meal.id];
        const recipe = RECIPES.find((r) => r.id === rid);
        if (!recipe) return;
        recipe.ing.forEach(([name, cat]) => {
          const key = normalize(name);
          if (!available.has(key)) {
            if (!needed.has(key)) needed.set(key, { name, category: cat, from: new Set() });
            needed.get(key).from.add(recipe.name);
          }
        });
      });
    });
  }
  Object.entries(rebost).forEach(([cat, items]) => {
    items.forEach((it) => {
      if (!it.checked) {
        const key = normalize(it.name);
        if (!needed.has(key)) needed.set(key, { name: it.name, category: cat, from: new Set(["Rebost habitual"]) });
      }
    });
  });
  return Array.from(needed.values()).sort((a, b) => a.category.localeCompare(b.category));
}

/* ============================================================
   APP PRINCIPAL
   ============================================================ */
function KomeApp() {
  useFonts();

  const [tab, setTab] = useState("menu");
  const [loaded, setLoaded] = useState(false);
  const [filters, setFilters] = useState({ edad: "", dieta: [], tiempos: [], recetasNuevas: { desayuno: 7, comida: 7, cena: 7 } });
  const [rebost, setRebost] = useState(
    Object.fromEntries(Object.entries(REBOST_DEFAULT).map(([k, v]) => [k, v.map((n) => ({ name: n, checked: false }))]))
  );
  const [weekMenu, setWeekMenu] = useState(null);
  const [favorites, setFavorites] = useState([]);
  const [history, setHistory] = useState([]);
  const [shoppingChecked, setShoppingChecked] = useState({});
  const [selectedRecipe, setSelectedRecipe] = useState(null);
  const [imagePreview, setImagePreview] = useState(null);
  const [toast, setToast] = useState(null);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2200); };

  useEffect(() => {
    (async () => {
      const f = await storageGet("kome:filters", null);
      const r = await storageGet("kome:rebost", null);
      const w = await storageGet("kome:weekMenu", null);
      const fav = await storageGet("kome:favorites", []);
      const h = await storageGet("kome:history", []);
      const sc = await storageGet("kome:shoppingChecked", {});
      if (f) {
        // Compatibilidad con filtros guardados de versiones anteriores
        // (donde "recetasNuevas" era un solo número, no un objeto por comida)
        const rn = f.recetasNuevas;
        const recetasNuevas =
          rn && typeof rn === "object"
            ? { desayuno: rn.desayuno ?? 7, comida: rn.comida ?? 7, cena: rn.cena ?? 7 }
            : { desayuno: 7, comida: 7, cena: 7 };
        setFilters({
          edad: f.edad ?? "",
          dieta: Array.isArray(f.dieta) ? f.dieta : [],
          tiempos: Array.isArray(f.tiempos) ? f.tiempos : [],
          recetasNuevas,
        });
      }
      if (r) setRebost(r);
      if (w) setWeekMenu(w);
      setFavorites(fav || []);
      setHistory(h || []);
      setShoppingChecked(sc || {});
      setLoaded(true);
    })();
  }, []);

  useEffect(() => { if (loaded) storageSet("kome:filters", filters); }, [filters, loaded]);
  useEffect(() => { if (loaded) storageSet("kome:rebost", rebost); }, [rebost, loaded]);
  useEffect(() => { if (loaded) storageSet("kome:weekMenu", weekMenu); }, [weekMenu, loaded]);
  useEffect(() => { if (loaded) storageSet("kome:favorites", favorites); }, [favorites, loaded]);
  useEffect(() => { if (loaded) storageSet("kome:history", history); }, [history, loaded]);
  useEffect(() => { if (loaded) storageSet("kome:shoppingChecked", shoppingChecked); }, [shoppingChecked, loaded]);

  const toggleDiet = (id) => setFilters((f) => ({ ...f, dieta: f.dieta.includes(id) ? f.dieta.filter((x) => x !== id) : [...f.dieta, id] }));
  const toggleTiempo = (id) => setFilters((f) => ({ ...f, tiempos: f.tiempos.includes(id) ? f.tiempos.filter((x) => x !== id) : [...f.tiempos, id] }));

  const handleGenerate = () => {
    try {
      const menu = generateWeekMenu(filters, favorites, history, rebost);
      setWeekMenu(menu);
      showToast("¡Menú semanal listo! ✿");
    } catch (e) {
      console.error(e);
      alert("No se pudo generar el menú: " + (e && e.message ? e.message : e));
    }
  };

  const saveToHistory = () => {
    if (!weekMenu) return;
    setHistory((h) => [{ id: Date.now(), date: new Date().toISOString(), menu: weekMenu }, ...h].slice(0, 20));
    showToast("Menú guardado en el histórico");
  };

  const toggleFavorite = (id) => setFavorites((f) => (f.includes(id) ? f.filter((x) => x !== id) : [...f, id]));
  const toggleRebostItem = (cat, idx) => setRebost((r) => ({ ...r, [cat]: r[cat].map((it, i) => (i === idx ? { ...it, checked: !it.checked } : it)) }));
  const addRebostItem = (cat, name) => { if (!name.trim()) return; setRebost((r) => ({ ...r, [cat]: [...r[cat], { name: name.trim(), checked: true }] })); };
  const removeRebostItem = (cat, idx) => setRebost((r) => ({ ...r, [cat]: r[cat].filter((_, i) => i !== idx) }));

  const shoppingList = computeShoppingList(weekMenu, rebost);
  const toggleShoppingItem = (key) => setShoppingChecked((s) => ({ ...s, [key]: !s[key] }));

  const batchRecipes = weekMenu
    ? Array.from(new Set(DAYS.flatMap((_, di) => MEALS.map((m) => weekMenu[di][m.id])).filter((id) => RECIPES.find((r) => r.id === id)?.batch)))
        .map((id) => RECIPES.find((r) => r.id === id))
    : [];

  return (
    <div className="min-h-screen w-full flex justify-center" style={{ background: C.bg }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap');
        .kawaii-pop:active { transform: translateY(2px); box-shadow: none !important; }
        .kawaii-btn { transition: transform .08s ease; }
        .kawaii-btn:active { opacity: 0.8; }
        @keyframes floaty { 0%,100% { transform: translateY(0) rotate(-2deg);} 50% { transform: translateY(-3px) rotate(2deg);} }
        .float-idle { animation: floaty 3.2s ease-in-out infinite; }
        @keyframes wiggle { 0%,100% { transform: rotate(-3deg);} 50% { transform: rotate(3deg);} }
        .wiggle-idle { animation: wiggle 2.6s ease-in-out infinite; }
      `}</style>
      <div className="w-full max-w-md min-h-screen flex flex-col relative" style={{ background: C.bg }}>
        <TopBar tab={tab} />
        <main className="flex-1 overflow-y-auto pb-24 px-4 pt-4">
          {tab === "menu" && (
            <MenuTab filters={filters} toggleDiet={toggleDiet} toggleTiempo={toggleTiempo} setFilters={setFilters}
              weekMenu={weekMenu} onGenerate={handleGenerate} onSave={saveToHistory} favorites={favorites}
              toggleFavorite={toggleFavorite} openRecipe={setSelectedRecipe} showToast={showToast} onImageReady={setImagePreview} />
          )}
          {tab === "rebost" && <RebostTab rebost={rebost} toggleItem={toggleRebostItem} addItem={addRebostItem} removeItem={removeRebostItem} />}
          {tab === "compra" && <ShoppingTab list={shoppingList} checked={shoppingChecked} toggle={toggleShoppingItem} hasMenu={!!weekMenu} />}
          {tab === "batch" && <BatchTab recipes={batchRecipes} openRecipe={setSelectedRecipe} hasMenu={!!weekMenu} />}
          {tab === "historial" && <HistoryTab history={history} favorites={favorites} openRecipe={setSelectedRecipe} onClear={() => setHistory([])} />}
          {tab === "ajustes" && (
            <SettingsTab rebost={rebost} setRebost={setRebost}
              onResetAll={async () => { setWeekMenu(null); setFavorites([]); setHistory([]); setShoppingChecked({}); showToast("Datos reiniciados"); }} />
          )}
        </main>

        {toast && (
          <div className="absolute bottom-24 left-1/2 -translate-x-1/2 text-white text-sm px-4 py-2 rounded-full shadow-lg z-30 font-medium"
            style={{ background: C.ink, fontFamily: "'Zen Kaku Gothic New', sans-serif" }}>
            {toast}
          </div>
        )}

        <BottomNav tab={tab} setTab={setTab} />

        {selectedRecipe && (
          <RecipeModal recipe={RECIPES.find((r) => r.id === selectedRecipe)} onClose={() => setSelectedRecipe(null)}
            isFav={favorites.includes(selectedRecipe)} toggleFav={() => toggleFavorite(selectedRecipe)} />
        )}
        {imagePreview && <ImagePreviewModal dataUrl={imagePreview} onClose={() => setImagePreview(null)} />}
      </div>
    </div>
  );
}

  return (
    <div className="relative px-5 pt-6 pb-4" style={{ background: C.bg }}>

/* ---------------------- Tab: Menú ---------------------- */
function MenuTab({ filters, toggleDiet, toggleTiempo, setFilters, weekMenu, onGenerate, onSave, favorites, toggleFavorite, openRecipe, showToast, onImageReady }) {
  function roundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  const downloadImage = () => {
    if (!weekMenu) return;
    try {
      const W = 900, rowH = 96, headerH = 130, padX = 40;
      const H = headerH + rowH * DAYS.length + 40;
      const canvas = document.createElement("canvas");
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = C.ink; ctx.font = "bold 30px sans-serif"; ctx.fillText("Kome ♡ Menú semanal", padX, 50);
      ctx.font = "14px sans-serif"; ctx.fillStyle = C.inkSoft;
      ctx.fillText(new Date().toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" }), padX, 74);
      const colW = (W - padX * 2 - 140) / 3;
      MEALS.forEach((m, i) => { ctx.fillStyle = C.pinkDeep; ctx.font = "bold 14px sans-serif"; ctx.fillText(m.label.toUpperCase(), padX + 140 + i * colW, headerH - 12); });
      DAYS.forEach((day, di) => {
        const y = headerH + di * rowH;
        ctx.fillStyle = di % 2 === 0 ? "#FFFFFF" : "#FBF0E6";
        roundedRect(ctx, padX - 10, y - 24, W - padX * 2 + 20, rowH - 6, 14);
        ctx.fill();
        ctx.fillStyle = C.ink; ctx.font = "bold 15px sans-serif"; ctx.fillText(day, padX, y + 8);
        MEALS.forEach((m, i) => {
          const recipe = RECIPES.find((r) => r.id === weekMenu[di][m.id]);
          ctx.fillStyle = "#5B5348"; ctx.font = "13px sans-serif";
          wrapText(ctx, recipe ? recipe.name : "—", padX + 140 + i * colW, y, colW - 14, 16);
        });
      });
      const dataUrl = canvas.toDataURL("image/png");
      onImageReady(dataUrl);
    } catch (e) {
      console.error("Error generando la imagen", e);
      showToast("No se pudo generar la imagen, inténtalo de nuevo");
    }
  };

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(" "); let line = "", lines = [];
    words.forEach((w) => { const test = line + w + " "; if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w + " "; } else line = test; });
    lines.push(line);
    lines.slice(0, 2).forEach((l, i) => ctx.fillText(l.trim(), x, y + i * lineHeight));
  }

  return (
    <div className="space-y-5">
      <KawaiiCard tone="pink">
        <SectionTitle icon={<Sparkles size={17} style={{ color: C.pinkDeep }} />}>Filtros del menú</SectionTitle>
        <label className="text-xs text-[#9C8F82] font-semibold">Edad</label>
        <input type="number" min="0" value={filters.edad} onChange={(e) => setFilters((f) => ({ ...f, edad: e.target.value }))} placeholder="Ej. 3"
          className="w-full mt-1 mb-3 rounded-2xl px-3 py-2 text-sm outline-none" style={{ border: `2px solid ${C.line}` }} />
        <label className="text-xs text-[#9C8F82] font-semibold">Tipo de dieta</label>
        <div className="flex flex-wrap gap-2 mt-1 mb-3">
          {DIET_TAGS.map((d) => <Chip key={d.id} small tone="mint" active={filters.dieta.includes(d.id)} onClick={() => toggleDiet(d.id)}>{d.label}</Chip>)}
        </div>
        <label className="text-xs text-[#9C8F82] font-semibold">Tiempo de preparación</label>
        <div className="flex flex-wrap gap-2 mt-1 mb-3">
          {PREP_TIMES.map((p) => <Chip key={p.id} small tone="lavender" active={filters.tiempos.includes(p.id)} onClick={() => toggleTiempo(p.id)}>{p.label} <span className="opacity-70">({p.hint})</span></Chip>)}
        </div>
        <label className="text-xs text-[#9C8F82] font-semibold">Recetas nuevas esta semana (de 7 días)</label>
        <div className="space-y-2 mt-1.5 mb-1">
          {MEALS.map((m) => {
            const val = (filters.recetasNuevas && filters.recetasNuevas[m.id] != null) ? filters.recetasNuevas[m.id] : 7;
            return (
              <div key={m.id}>
                <div className="flex items-center justify-between text-xs text-[#5B5348] mb-0.5">
                  <span className="font-medium">{m.label}</span>
                  <span style={{ color: C.mintDeep }} className="font-semibold">{val} nuevas / {7 - val} repetidas</span>
                </div>
                <input type="range" min="0" max="7" step="1" value={val}
                  onChange={(e) => setFilters((f) => ({ ...f, recetasNuevas: { ...(f.recetasNuevas || {}), [m.id]: Number(e.target.value) } }))}
                  className="w-full" style={{ accentColor: C.mintDeep }} />
              </div>
            );
          })}
        </div>
        <p className="text-[11px] text-[#9C8F82] mt-1 mb-3">Las repetidas se toman de menús guardados en tu histórico (si aún no hay, se generan nuevas).</p>
        <button type="button" onClick={onGenerate} className="kawaii-btn w-full rounded-full text-white py-2.5 font-bold flex items-center justify-center gap-2"
          style={{ background: C.mintDeep, boxShadow: "0 3px 0 #4E8C74", fontFamily: "'Zen Maru Gothic', sans-serif", touchAction: "manipulation" }}>
          <RefreshCw size={16} /> {weekMenu ? "Regenerar menú semanal" : "Generar menú semanal"}
        </button>
      </KawaiiCard>

      {weekMenu ? (
        <div className="space-y-3">
          <div className="flex gap-2">
            <button onClick={onSave} className="kawaii-btn flex-1 bg-white rounded-full py-2 text-sm font-semibold flex items-center justify-center gap-1.5"
              style={{ border: `2px solid ${C.pink}`, color: C.pinkDeep }}>
              <Heart size={15} /> Guardar en histórico
            </button>
            <button onClick={downloadImage} className="kawaii-btn flex-1 bg-white rounded-full py-2 text-sm font-semibold flex items-center justify-center gap-1.5"
              style={{ border: `2px solid ${C.lavender}`, color: C.lavenderDeep }}>
              <Download size={15} /> Guardar imagen
            </button>
          </div>

          {DAYS.map((day, di) => (
            <KawaiiCard key={day} tone={di % 2 === 0 ? "pink" : "mint"}>
              <p className="text-sm font-bold mb-2" style={{ color: C.pinkDeep, fontFamily: "'Zen Maru Gothic', sans-serif" }}>{day}</p>
              <div className="space-y-1.5">
                {MEALS.map((m) => {
                  const recipe = RECIPES.find((r) => r.id === weekMenu[di][m.id]);
                  if (!recipe) return null;
                  const isFav = favorites.includes(recipe.id);
                  return (
                    <button key={m.id} onClick={() => openRecipe(recipe.id)} className="w-full flex items-start justify-between gap-2 rounded-2xl px-3 py-2 text-left" style={{ background: "#FFF8F2" }}>
                      <div className="min-w-0 flex-1">
                        <span className="text-[10px] uppercase tracking-wide text-[#B0A79B]">{m.label}</span>
                        <div className="flex items-start gap-1.5 mt-0.5">
                          <span className="text-sm text-[#3B352F] leading-snug break-words">{recipe.name}</span>
                          {recipe.batch && <span className="shrink-0 mt-0.5"><IconBento size={16} /></span>}
                        </div>
                      </div>
                      <div className="flex items-center gap-1 shrink-0 pt-3.5">
                        <button
                          onClick={(e) => { e.stopPropagation(); toggleFavorite(recipe.id); }}
                          className="p-0.5"
                          aria-label={isFav ? "Quitar de favoritas" : "Marcar como favorita"}
                        >
                          <Star size={16} className={isFav ? "fill-[#F5A9BC]" : ""} style={{ color: isFav ? C.pink : "#D9CFC2" }} />
                        </button>
                        <ChevronRight size={15} className="text-[#B0A79B]" />
                      </div>
                    </button>
                  );
                })}
              </div>
            </KawaiiCard>
          ))}
        </div>
      ) : (
        <EmptyState icon={<IconOnigiri size={56} />} title="Aún no hay menú" text="Ajusta los filtros y pulsa «Generar menú semanal» para crear tu propuesta equilibrada." />
      )}
    </div>
  );
}

/* ---------------------- Enlace a receta externa ---------------------- */
function RecipeLink({ url }) {
  const [copied, setCopied] = useState(false);

  const openLink = () => {
    // En algunos entornos el sandbox del artifact bloquea target="_blank",
    // así que probamos varias formas de abrir el enlace.
    const win = window.open(url, "_blank", "noopener,noreferrer");
    if (!win) {
      try { window.top.location.href = url; } catch (e) { /* bloqueado por el sandbox */ }
    }
  };

  const copyLink = async () => {
    try {
      await navigator.clipboard.writeText(url);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (e) {
      // Sin acceso al portapapeles: el enlace de texto sigue siendo seleccionable
    }
  };

  return (
    <div>
      <a
        href={url}
        target="_blank"
        rel="noopener noreferrer"
        onClick={openLink}
        className="kawaii-btn flex items-center justify-center gap-2 text-white rounded-full py-2.5 text-sm font-bold"
        style={{ background: C.mintDeep }}
      >
        Ver receta completa <ExternalLink size={14} />
      </a>
      <div className="mt-2 flex items-center gap-2 rounded-2xl px-3 py-2" style={{ background: "#FFF8F2", border: `1.5px solid ${C.line}` }}>
        <span className="text-xs text-[#9C8F82] truncate flex-1" title={url}>{url}</span>
        <button onClick={copyLink} className="text-xs font-semibold shrink-0" style={{ color: C.mintDeep }}>
          {copied ? "¡Copiado! ✓" : "Copiar"}
        </button>
      </div>
      <p className="text-[11px] text-[#B0A79B] mt-1.5">Si el botón no abre una pestaña nueva, copia el enlace y pégalo en Safari.</p>
    </div>
  );
}

/* ---------------------- Modal previsualización de imagen ---------------------- */
function ImagePreviewModal({ dataUrl, onClose }) {
  const tryDownload = () => {
    const link = document.createElement("a");
    link.download = `kome-menu-semanal-${new Date().toISOString().slice(0, 10)}.png`;
    link.href = dataUrl;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };
  return (
    <div className="absolute inset-0 bg-black/40 flex items-end justify-center z-40" onClick={onClose}>
      <div className="bg-[#FFF8F2] w-full max-w-md rounded-t-[32px] p-5 max-h-[88%] overflow-y-auto" onClick={(e) => e.stopPropagation()} style={{ borderTop: `3px solid ${C.mint}` }}>
        <div className="w-10 h-1.5 bg-[#E2D8CA] rounded-full mx-auto mb-4" />
        <h3 className="text-lg mb-1" style={{ color: C.ink, fontFamily: "'Zen Maru Gothic', sans-serif", fontWeight: 700 }}>Tu menú en imagen</h3>
        <p className="text-xs text-[#9C8F82] mb-3">Mantén pulsada la imagen y elige «Añadir a Fotos» para guardarla en tu iPhone.</p>
        <img src={dataUrl} alt="Menú semanal" className="w-full rounded-2xl" style={{ border: `2px solid ${C.line}` }} />
        <button onClick={tryDownload} className="kawaii-btn w-full mt-3 rounded-full text-white py-2.5 text-sm font-bold flex items-center justify-center gap-2" style={{ background: C.mintDeep }}>
          <Download size={15} /> Intentar descargar
        </button>
        <button onClick={onClose} className="w-full mt-2 text-center text-sm text-[#9C8F82] py-2">Cerrar</button>
      </div>
    </div>
  );
}

/* ---------------------- Modal receta ---------------------- */
function RecipeModal({ recipe, onClose, isFav, toggleFav }) {
  if (!recipe) return null;
  return (
    <div className="absolute inset-0 bg-black/30 flex items-end justify-center z-40" onClick={onClose}>
      <div className="bg-[#FFF8F2] w-full max-w-md rounded-t-[32px] p-5 max-h-[80%] overflow-y-auto" onClick={(e) => e.stopPropagation()} style={{ borderTop: `3px solid ${C.pink}` }}>
        <div className="w-10 h-1.5 bg-[#E2D8CA] rounded-full mx-auto mb-4" />
        <div className="flex items-start justify-between mb-2">
          <h3 className="text-lg pr-4" style={{ color: C.ink, fontFamily: "'Zen Maru Gothic', sans-serif", fontWeight: 700 }}>{recipe.name}</h3>
          <button onClick={toggleFav} className="kawaii-btn flex flex-col items-center gap-0.5 shrink-0" aria-label={isFav ? "Quitar de favoritas" : "Marcar como favorita"}>
            <Star size={24} className={isFav ? "fill-[#F5A9BC]" : ""} style={{ color: isFav ? C.pink : "#B0A79B" }} />
            <span className="text-[9px] font-semibold" style={{ color: isFav ? C.pinkDeep : "#B0A79B" }}>{isFav ? "Favorita" : "Marcar"}</span>
          </button>
        </div>
        <div className="flex flex-wrap gap-1.5 mb-4">
          <Chip small active tone="pink">{recipe.meal}</Chip>
          <Chip small tone="lavender">{PREP_TIMES.find((p) => p.id === recipe.prepTime)?.label}</Chip>
          {recipe.batch && <span className="inline-flex items-center gap-1 rounded-full px-3 py-1.5 text-xs font-semibold" style={{ background: C.butter, color: "#7A5B12" }}><IconBento size={16} /> Batch cooking</span>}
          {recipe.dietTags.map((t) => <Chip key={t} small tone="mint">{DIET_TAGS.find((d) => d.id === t)?.label}</Chip>)}
        </div>
        <p className="text-xs font-bold text-[#9C8F82] uppercase tracking-wide mb-1.5">Ingredientes</p>
        <ul className="text-sm text-[#3B352F] space-y-1 mb-4">
          {recipe.ing.map(([name], i) => <li key={i} className="flex items-center gap-1.5"><IconLeaf size={12} /> {name}</li>)}
        </ul>
        {recipe.complex && recipe.link && <RecipeLink url={recipe.link} />}
        <button onClick={onClose} className="w-full mt-3 text-center text-sm text-[#9C8F82] py-2">Cerrar</button>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<KomeApp />);

  var loadingEl = document.getElementById('kome-loading');
  if (loadingEl && !loadingEl.querySelector('#kome-error').textContent) loadingEl.remove();
} catch (e) {
  var el = document.getElementById('kome-error');
  if (el) el.textContent += "\n[error en la app] " + (e && e.message ? e.message : e) + (e && e.stack ? ("\n" + e.stack) : "");
  console.error(e);
}
</script>
</body>
</html>
